<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Memotti & Grasse Risate</title>
<style>
:root{--bg:#0b0b12;--card:#171722;--card2:#1f1f2e;--tx:#f3f3f8;--mu:#8b8ba0;--ac:#8b5cf6;--r:#ff4d5e;--g:#2ee59d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(900px 500px at 10% -10%,#2a1b5a55,transparent),radial-gradient(800px 500px at 100% 0,#0e3b3055,transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:clamp(28px,6vw,52px);margin:20px 0 6px;background:linear-gradient(90deg,#c4b5fd,#fff,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.hero{text-align:center;margin:30px 0}.hero p{color:var(--mu);font-size:18px;margin:0}
.tiles2,.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-top:24px}
.big{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid #ffffff14;border-radius:24px;padding:36px 16px;text-align:center;font-size:44px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;gap:10px;align-items:center}
.big b{font-size:18px;letter-spacing:3px}.big:hover{transform:translateY(-4px);box-shadow:0 0 36px #8b5cf655;border-color:#8b5cf6}
.top{display:flex;gap:8px;align-items:center;margin-bottom:14px}.top b{font-size:20px;margin-left:6px}
button,.b,.bp{font:inherit;color:var(--tx);background:var(--card2);border:1px solid #ffffff1a;border-radius:12px;padding:10px 14px;cursor:pointer;transition:.2s}
button:hover{border-color:var(--ac);box-shadow:0 0 14px #8b5cf644}
.bp{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;font-weight:700}
.dng{color:#ff7b88}
input,select,textarea{font:inherit;color:var(--tx);background:#0e0e16;border:1px solid #ffffff22;border-radius:10px;padding:10px;width:100%}
input[type=color]{padding:2px;height:40px}input[type=range]{padding:0;accent-color:var(--ac)}input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.mc{position:relative;background:var(--card);border:1px solid #ffffff12;border-radius:16px;padding:14px;margin:10px 0}
.mc p{margin:0 0 8px;font-size:18px;white-space:pre-wrap}.mc img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:8px 0}.mc audio{width:100%}
.mc>i{position:absolute;top:10px;right:12px;cursor:pointer;font-style:normal;opacity:.6}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tg span,.chip{background:#ffffff12;border-radius:20px;padding:3px 10px;font-size:13px}.chip{cursor:pointer;font-size:15px;padding:8px 14px}
.ra{color:var(--r)}.rt{color:var(--g)}
h3.gh{margin:22px 0 4px;color:#c4b5fd}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ch{background:var(--card);border-radius:18px;padding:12px;text-align:center;cursor:pointer;position:relative;border:1px solid #ffffff12}.ch:hover{border-color:var(--ac)}
.ch img,.ch .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#0e0e16;display:flex;align-items:center;justify-content:center;font-size:48px}
.ch i{position:absolute;top:16px;right:16px;font-style:normal;background:#000a;border-radius:8px;padding:4px 6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tab.act{background:var(--ac);border-color:var(--ac)}.tab.over{outline:2px dashed var(--g)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.bar input[type=text],.bar input:not([type]){flex:1;min-width:140px}.bar input[type=range]{width:120px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;grid-auto-flow:dense;min-height:50vh}
.tile{--c:#8b5cf6;position:relative;min-height:112px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none;transition:transform .15s,box-shadow .25s;padding:10px;text-align:center;box-shadow:0 6px 18px #0006}
.tile:hover{transform:translateY(-3px);box-shadow:0 0 30px var(--c)}.tile:active{transform:scale(.96)}
.tile .ic{font-size:30px}.tile b{font-size:16px;word-break:break-word}.tile small{opacity:.7;font-size:11px}
.tile .ed{position:absolute;top:6px;right:8px;font-style:normal;background:#0006;border-radius:8px;padding:2px 6px;font-size:13px}
.tile.on{animation:pl .5s infinite alternate}@keyframes pl{from{box-shadow:0 0 10px var(--c)}to{box-shadow:0 0 44px 8px var(--c);transform:scale(1.03)}}
.ov{position:fixed;inset:0;background:#000b;display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:10}.ov.show{display:flex}#e{z-index:20}#d{z-index:30}
.box{background:var(--card);border:1px solid #ffffff1a;border-radius:22px;padding:18px;width:min(760px,100%)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#wv{overflow-x:auto;background:#0a0a10;border-radius:12px;margin:10px 0}#in{position:relative;height:160px}#cv{display:block}
#sel{position:absolute;top:0;bottom:0;background:#8b5cf633;border-left:2px solid var(--g);border-right:2px solid var(--r);pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:22px;margin-left:-11px;cursor:ew-resize;touch-action:none;z-index:2}
.h::after{content:"";position:absolute;left:9px;top:0;bottom:0;width:4px;background:currentColor;border-radius:3px}#hs{color:var(--g)}#he{color:var(--r)}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
progress{width:100%;accent-color:var(--ac)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000d;border:1px solid #ffffff33;border-radius:14px;padding:12px 18px;z-index:50;max-width:92vw;display:none}
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}
</style></head><body>
<div id="app"></div><input type="file" id="cf" accept="image/*" hidden>
<div class="ov" id="m"></div><div class="ov" id="e"></div><div class="ov" id="d"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)};
let S={sounds:[],cats:[{id:'c1',name:'MEME'},{id:'c2',name:'RISATE'},{id:'c3',name:'EFFETTI'}],memes:[],chars:[],master:1},cat='c1',Q='',V={v:'menu'},H=[],ed=null,rec=null,dcb=null,dragId=null,curCh=null;
/* ---------- IndexedDB ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('memotti',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(st,m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction(st,m);const q=f(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const put=(st,k,v)=>tx(st,'readwrite',o=>o.put(v,k)),get=(st,k)=>tx(st,'readonly',o=>o.get(k)),del=(st,k)=>tx(st,'readwrite',o=>o.delete(k));
const save=()=>put('kv','state',S).catch(e=>toast('Errore di salvataggio: '+e.message));
const urls={};async function url(k){if(urls[k])return urls[k];const b=await get('blobs',k).catch(()=>null);return b?urls[k]=URL.createObjectURL(b):null}
async function hydrate(){for(const e of document.querySelectorAll('[data-img],[data-aud]')){const k=e.dataset.img||e.dataset.aud,u=await url(k);if(u)e.src=u;else e.style.display='none'}}
/* ---------- Audio engine ---------- */
let ctx,master;const bufs={},playing={};
const AC=()=>{if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();master.gain.value=S.master;return ctx};
async function getBuf(id){if(bufs[id])return bufs[id];const b=await get('blobs',id);if(!b)return null;return bufs[id]=await AC().decodeAudioData(await b.arrayBuffer())}
const mark=(id,on)=>document.querySelector(`[data-sid="${id}"]`)?.classList.toggle('on',!!on);
const stopS=id=>(playing[id]||[]).slice().forEach(x=>{try{x.stop()}catch{}}),stopAll=()=>Object.keys(playing).forEach(stopS);
async function play(s){const c=AC();if((playing[s.id]||[]).length&&s.mode!=='single'){stopS(s.id);return}
 let b;try{b=await getBuf(s.blob)}catch{return toast('Audio non leggibile: riapri l\'editor e risalvalo')}
 if(!b)return toast('Nessun audio: modifica il tasto e apri l\'editor audio');
 if(s.solo)stopAll();const src=c.createBufferSource(),g=c.createGain();src.buffer=b;src.loop=s.mode==='loop';g.gain.value=s.vol??1;src.connect(g).connect(master);
 (playing[s.id]=playing[s.id]||[]).push(src);mark(s.id,1);src.onended=()=>{playing[s.id]=(playing[s.id]||[]).filter(x=>x!==src);if(!playing[s.id].length)mark(s.id,0)};src.start()}
function toWav(b){const ch=b.numberOfChannels,n=b.length,sr=b.sampleRate,ab=new ArrayBuffer(44+n*ch*2),v=new DataView(ab),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*ch*2,true);
 const d=[];for(let c=0;c<ch;c++)d.push(b.getChannelData(c));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}return new Blob([ab],{type:'audio/wav'})}
async function renderFx(buf,st,en,fx){const sr=buf.sampleRate,ch=buf.numberOfChannels,a=Math.floor(st*sr),len=Math.max(1,Math.min(buf.length-a,Math.floor((en-st)*sr)));
 const sl=new AudioBuffer({length:len,numberOfChannels:ch,sampleRate:sr});let peak=0;
 for(let c=0;c<ch;c++){const o=sl.getChannelData(c);o.set(buf.getChannelData(c).subarray(a,a+len));if(fx.rev)o.reverse();if(fx.norm)for(let i=0;i<len;i++)peak=Math.max(peak,Math.abs(o[i]))}
 const rate=Math.min(4,Math.max(.25,fx.speed*Math.pow(2,fx.pitch/12))),dur=len/sr/rate,tail=fx.echo?1.5:0,oc=new OfflineAudioContext(ch,Math.ceil((dur+tail)*sr),sr),s=oc.createBufferSource();
 s.buffer=sl;s.playbackRate.value=rate;const g=oc.createGain(),gv=fx.vol*(fx.norm&&peak>0?.97/peak:1);
 if(fx.fi>0||fx.fo>0){g.gain.setValueAtTime(fx.fi>0?0:gv,0);if(fx.fi>0)g.gain.linearRampToValueAtTime(gv,Math.min(fx.fi,dur));if(fx.fo>0){g.gain.setValueAtTime(gv,Math.max(fx.fi,dur-fx.fo));g.gain.linearRampToValueAtTime(0,dur)}}else g.gain.value=gv;
 s.connect(g);g.connect(oc.destination);if(fx.echo){const d=oc.createDelay(1),f=oc.createGain(),w=oc.createGain();d.delayTime.value=.28;f.gain.value=.45;w.gain.value=.6;g.connect(d);d.connect(f);f.connect(d);d.connect(w);w.connect(oc.destination)}
 s.start();return oc.startRendering()}
/* ---------- Navigazione ---------- */
const T={memotti:'Memotti',raccolta:'Raccolta',random:'Random',cerca:'Cerca per',ck:'Cerca per',chars:'Personaggi',list:'Meme',sb:'Soundboard'};
function go(v,p){H.push(V);V={v,p};render()}
const card=m=>`<div class="mc"><p>${esc(m.text)}</p>${m.img?`<img data-img="img:${m.id}">`:''}${m.aud?`<audio controls data-aud="aud:${m.id}"></audio>`:''}<div class="tg">${m.place?`<span>📍 ${esc(m.place)}</span>`:''}${m.when?`<span>🗓 ${esc(m.when)}</span>`:''}${m.char?`<span>👤 ${esc(m.char)}</span>`:''}${m.by?`<span class="${m.by=='Andrea'?'ra':'rt'}">${m.by}</span>`:''}</div><i data-a="delm" data-id="${m.id}">🗑</i></div>`;
const tile=s=>`<div class="tile ${(playing[s.id]||[]).length?'on':''}" data-sid="${s.id}" data-a="play" data-id="${s.id}" draggable="true" style="background:${s.bg};color:${s.fg};grid-column:span ${s.size||1};--c:${s.bg}"><span class="ic">${s.icon}</span><b>${esc(s.name)}</b><small>${s.dur?s.dur.toFixed(1)+' s':'vuoto'}</small><i class="ed" data-a="edit" data-id="${s.id}">✎</i></div>`;
const gridHtml=()=>{const q=Q.toLowerCase(),l=S.sounds.filter(s=>q?s.name.toLowerCase().includes(q):s.cat==cat);return l.map(tile).join('')||'<p style="color:var(--mu)">Nessun suono qui. Premi “+ CREA NUOVO SUONO”.</p>'};
const refreshGrid=()=>{const g=$('#grid');if(g)g.innerHTML=gridHtml()};
const uniq=k=>[...new Set(S.memes.map(m=>m[k]).filter(Boolean))].sort();
const memoList=(l,empty)=>l.map(card).join('')||`<p style="color:var(--mu)">${empty||'Ancora niente qui.'}</p>`;
const views={
menu:()=>`<div class="hero"><h1>Memotti &amp; Grasse Risate</h1><p>Benvenuti <b style="color:var(--r)">Andrea</b> &amp; <b style="color:var(--g)">Tommaso</b></p></div><div class="tiles2"><div class="big" data-a="go" data-v="memotti">😂<b>MEMOTTI</b></div><div class="big" data-a="go" data-v="sb">🎛️<b>SOUNDBOARD</b></div></div>`,
memotti:()=>`<div class="tiles">${[['raccolta','📚','Raccolta'],['random','🎲','Random'],['cerca','🔎','Cerca per'],['chars','🧑‍🎤','Personaggi']].map(x=>`<div class="big" data-a="go" data-v="${x[0]}">${x[1]}<b>${x[2].toUpperCase()}</b></div>`).join('')}</div>`,
raccolta:()=>{const gr={};S.memes.forEach(m=>{const k=m.char?'👤 '+m.char:m.place?'📍 '+m.place:m.when?'🗓 '+m.when:'Generico';(gr[k]=gr[k]||[]).push(m)});
 return `<button class="bp" data-a="newm">+ Nuovo meme / frase iconica</button>`+(Object.keys(gr).sort().map(k=>`<h3 class="gh">${esc(k)}</h3>`+gr[k].map(card).join('')).join('')||'<p style="color:var(--mu)">Nessun meme ancora: aggiungi il primo!</p>')},
random:()=>{const m=S.memes[Math.floor(Math.random()*S.memes.length)];return (m?card(m):'<p style="color:var(--mu)">Aggiungi prima qualche meme nella Raccolta.</p>')+`<button class="bp" data-a="rnd">🎲 Un altro!</button>`},
cerca:()=>`<div class="tiles">${[['place','📍','Luogo'],['char','👤','Personaggio'],['when','🗓','Data / periodo']].map(x=>`<div class="big" data-a="go" data-v="ck" data-k="${x[0]}">${x[1]}<b>${x[2].toUpperCase()}</b></div>`).join('')}</div>`,
ck:p=>`<div class="row">${uniq(p.k).map(v=>`<span class="chip" data-a="go" data-v="list" data-k="${p.k}" data-val="${esc(v)}">${esc(v)}</span>`).join('')||'<span style="color:var(--mu)">Nessuna parola chiave registrata.</span>'}</div>`,
list:p=>`<h3 class="gh">${esc(p.val)}</h3>`+memoList(S.memes.filter(m=>m[p.k]===p.val)),
chars:()=>`<button class="bp" data-a="newch">+ Nuovo personaggio</button><div class="chs" style="margin-top:14px">${S.chars.map(c=>`<div class="ch" data-a="go" data-v="list" data-k="char" data-val="${esc(c.name)}">${c.photo?`<img data-img="cph:${c.id}">`:'<div class="ph">👤</div>'}<i data-a="chph" data-id="${c.id}">📷</i><b>${esc(c.name)}</b></div>`).join('')}</div>`,
sb:()=>`<div class="tabs">${S.cats.map(c=>`<button class="tab ${c.id==cat?'act':''}" data-a="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('')}<button data-a="addcat">＋</button><button data-a="rencat">✎</button><button data-a="delcat" class="dng">🗑</button></div>
<div class="bar"><input placeholder="🔎 Cerca suoni…" data-i="q" value="${esc(Q)}"><span>🔊</span><input type="range" min="0" max="1" step=".01" value="${S.master}" data-i="master"><button data-a="stopall">⏹ STOP</button><button class="bp" data-a="newsnd">+ CREA NUOVO SUONO</button></div><div id="grid">${gridHtml()}</div>`};
function render(){const v=V.v;$('#app').innerHTML=(v=='menu'?'':`<div class="top"><button data-a="back">←</button><button data-a="home">🏠</button><b>${T[v]||''}</b></div>`)+views[v](V.p);hydrate()}
/* ---------- Dialoghi ---------- */
const closeM=()=>$('#m').classList.remove('show');
function ask(t,def,cb,noInput){dcb=cb;$('#d').innerHTML=`<div class="box" style="margin-top:12vh"><h3>${t}</h3>${noInput?'':`<input id="di" value="${esc(def)}">`}<div class="row"><button data-a="dx">Annulla</button><button class="bp" data-a="dok">OK</button></div></div>`;$('#d').classList.add('show');$('#di')?.focus()}
const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
/* ---------- Azioni ---------- */
const snd=id=>S.sounds.find(s=>s.id==id);
const acts={
go:d=>go(d.v,{k:d.k,val:d.val}),back:()=>{V=H.pop()||{v:'menu'};render()},home:()=>{H=[];V={v:'menu'};render()},rnd:()=>render(),
play:d=>{const s=snd(d.id);s&&play(s)},stopall:stopAll,
cat:d=>{cat=d.id;Q='';render()},
addcat:()=>ask('Nome nuova categoria','',v=>{if(v?.trim()){const c={id:uid(),name:v.trim().toUpperCase()};S.cats.push(c);cat=c.id;save();render()}}),
rencat:()=>ask('Rinomina categoria',S.cats.find(c=>c.id==cat).name,v=>{if(v?.trim()){S.cats.find(c=>c.id==cat).name=v.trim().toUpperCase();save();render()}}),
delcat:()=>{if(S.cats.length<2)return toast('Serve almeno una categoria');const c=S.cats.find(c=>c.id==cat);ask(`Eliminare “${esc(c.name)}”? I suoni verranno spostati nella prima categoria rimasta.`,'',()=>{S.cats=S.cats.filter(x=>x.id!=cat);S.sounds.forEach(s=>{if(s.cat==cat)s.cat=S.cats[0].id});cat=S.cats[0].id;save();render()},1)},
newsnd:()=>{const P=['#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6','#ef4444','#14b8a6'],s={id:uid(),name:'NUOVO SUONO',bg:P[S.sounds.length%P.length],fg:'#ffffff',icon:'🔊',size:1,mode:'single',solo:false,vol:1,cat,blob:null,dur:0};S.sounds.push(s);save();refreshGrid();acts.edit({id:s.id})},
edit:d=>{const s=snd(d.id),ic=['🔊','😂','👏','💥','🎵','🥁','🎺','🤖','👻','🔥','💩','🐔','😱','🎤','🚨','⭐','🤡','🎉'];
 $('#m').innerHTML=`<div class="box"><h3>Modifica tasto</h3><label>Nome</label><input data-i="name" data-id="${s.id}" value="${esc(s.name)}">
 <div class="g2"><div><label>Sfondo</label><input type="color" data-i="bg" data-id="${s.id}" value="${s.bg}"></div><div><label>Testo</label><input type="color" data-i="fg" data-id="${s.id}" value="${s.fg}"></div>
 <div><label>Icona</label><select data-i="icon" data-id="${s.id}">${ic.map(i=>`<option ${i==s.icon?'selected':''}>${i}</option>`).join('')}</select></div>
 <div><label>Dimensione</label><select data-i="size" data-id="${s.id}"><option value="1" ${s.size==1?'selected':''}>Normale</option><option value="2" ${s.size==2?'selected':''}>Largo</option></select></div>
 <div><label>Modalità</label><select data-i="mode" data-id="${s.id}">${[['single','Singola'],['loop','Loop'],['ps','Play/Stop']].map(x=>`<option value="${x[0]}" ${x[0]==s.mode?'selected':''}>${x[1]}</option>`).join('')}</select></div>
 <div><label>Categoria</label><select data-i="cat" data-id="${s.id}">${S.cats.map(c=>`<option value="${c.id}" ${c.id==s.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
 <label>Volume del tasto</label><input type="range" min="0" max="1.5" step=".01" data-i="vol" data-id="${s.id}" value="${s.vol}">
 <label><input type="checkbox" data-i="solo" data-id="${s.id}" ${s.solo?'checked':''}> Interrompi gli altri suoni quando parte (altrimenti si sovrappone)</label>
 <p>Durata suono: <b id="durv">${s.dur?s.dur.toFixed(2)+' s':'nessun audio'}</b></p>
 <div class="row"><button class="bp" data-a="opened" data-id="${s.id}">🎚 APRI EDITOR AUDIO</button><button data-a="dup" data-id="${s.id}">Duplica</button><button data-a="mv" data-id="${s.id}" data-dir="-1">◀</button><button data-a="mv" data-id="${s.id}" data-dir="1">▶</button><button class="dng" data-a="dels" data-id="${s.id}">Elimina</button><button data-a="closem">Chiudi</button></div></div>`;$('#m').classList.add('show')},
closem:()=>{closeM();render()},
mv:d=>{const s=snd(d.id),sib=S.sounds.filter(x=>x.cat==s.cat),o=sib[sib.indexOf(s)+ +d.dir];if(!o)return;const i=S.sounds.indexOf(s),j=S.sounds.indexOf(o);S.sounds[i]=o;S.sounds[j]=s;save();refreshGrid()},
dup:async d=>{const s=snd(d.id),n={...s,id:uid(),name:s.name+' (copia)'};if(s.blob){const b=await get('blobs',s.blob);n.blob='snd:'+uid();await put('blobs',n.blob,b)}S.sounds.splice(S.sounds.indexOf(s)+1,0,n);save();refreshGrid();toast('Tasto duplicato')},
dels:d=>ask('Eliminare questo tasto e il suo audio?','',()=>{const s=snd(d.id);if(s.blob)del('blobs',s.blob);delete bufs[s.blob];S.sounds=S.sounds.filter(x=>x!=s);save();closeM();render()},1),
dx:()=>$('#d').classList.remove('show'),dok:()=>{const v=$('#di')?.value;$('#d').classList.remove('show');dcb&&dcb(v)},
/* memotti */
newm:()=>{rec=null;$('#m').innerHTML=`<div class="box"><h3>Nuovo meme / frase iconica</h3><label>Frase / situazione / meme</label><textarea id="f_text" rows="3"></textarea><label>Foto (opzionale)</label><input type="file" id="f_img" accept="image/*">
 <label>Audio (opzionale)</label><div class="row" style="margin:0"><button data-a="rec" id="recb">● Registra</button><audio id="recp" controls hidden></audio></div>
 <div class="g2"><div><label>Luogo</label><input id="f_place" list="dp">${dl('dp',uniq('place'))}</div><div><label>Data / periodo</label><input id="f_when" list="dw">${dl('dw',uniq('when'))}</div>
 <div><label>Personaggio</label><input id="f_char" list="dc">${dl('dc',S.chars.map(c=>c.name))}</div><div><label>Chi lo registra</label><select id="f_by"><option value="">—</option><option>Andrea</option><option>Tommaso</option></select></div></div>
 <div class="row"><button class="bp" data-a="savem">Salva</button><button data-a="closeM2">Annulla</button></div></div>`;$('#m').classList.add('show')},
closeM2:()=>{if(rec?.mr&&rec.mr.state!=='inactive')rec.mr.stop();closeM()},
rec:async()=>{if(rec?.mr?.state==='recording'){rec.mr.stop();return}
 try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),ch=[];rec={mr,blob:null};mr.ondataavailable=e=>ch.push(e.data);
 mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());rec.blob=new Blob(ch,{type:mr.mimeType});const p=$('#recp');if(p){p.src=URL.createObjectURL(rec.blob);p.hidden=false;$('#recb').textContent='● Registra di nuovo'}};mr.start();$('#recb').textContent='■ Stop'}
 catch{toast('Microfono non disponibile o permesso negato')}},
savem:async()=>{const f=$('#f_img').files[0],t=$('#f_text').value.trim();if(rec?.mr?.state==='recording')return toast('Ferma prima la registrazione');if(!t&&!f&&!rec?.blob)return toast('Scrivi una frase o allega qualcosa');
 const m={id:uid(),text:t,by:$('#f_by').value,place:$('#f_place').value.trim(),when:$('#f_when').value.trim(),char:$('#f_char').value.trim()};
 if(f){await put('blobs','img:'+m.id,f);m.img=1}if(rec?.blob){await put('blobs','aud:'+m.id,rec.blob);m.aud=1}
 if(m.char){const e=S.chars.find(c=>c.name.toLowerCase()==m.char.toLowerCase());if(e)m.char=e.name;else S.chars.push({id:uid(),name:m.char})}
 S.memes.unshift(m);save();rec=null;closeM();render()},
delm:d=>ask('Eliminare questo meme?','',()=>{del('blobs','img:'+d.id);del('blobs','aud:'+d.id);S.memes=S.memes.filter(m=>m.id!=d.id);save();render()},1),
newch:()=>ask('Nome personaggio','',v=>{v=v?.trim();if(v&&!S.chars.some(c=>c.name.toLowerCase()==v.toLowerCase())){S.chars.push({id:uid(),name:v});save();render()}}),
chph:d=>{curCh=d.id;$('#cf').value='';$('#cf').click()},
/* editor audio */
opened:d=>openEd(d.id),
po:()=>{if(!ed.buf)return;if(ed.src&&ed.orig){ed.pos=AC().currentTime-ed.t0;stopEd()}else startEd(ed.buf,ed.pos>=ed.buf.duration-.05?0:ed.pos,false,true)},
ps:()=>{if(ed.buf){ed.pos=0;stopEd();ph()}},
psel:()=>prev(ed.loop),
lp:(d,el)=>{ed.loop=!ed.loop;el.classList.toggle('bp',ed.loop)},
zi:()=>zoom(1.5),zo:()=>zoom(1/1.5),
undo:()=>{if(ed.hi>0){ed.hi--;applyH()}},redo:()=>{if(ed.hi<ed.h.length-1){ed.hi++;applyH()}},
resume:async()=>{const b=await get('blobs','draft:'+ed.sid);b&&loadFile(b)},
sv:async()=>{if(!ed.buf)return;stopEd();setSt('Taglio ed elaborazione…',null);
 try{const b=await renderFx(ed.buf,ed.st,ed.en,ed.fx),id='snd:'+uid(),s=snd(ed.sid);await put('blobs',id,toWav(b));if(s.blob){del('blobs',s.blob);delete bufs[s.blob]}s.blob=id;s.dur=b.duration;bufs[id]=b;save();del('blobs','draft:'+ed.sid);
 const dv=$('#durv');if(dv)dv.textContent=b.duration.toFixed(2)+' s';closeEd();refreshGrid();toast('Audio salvato ✓')}catch(e){setSt('',-1);toast('Errore nel salvataggio: '+e.message)}},
closeed:()=>{stopEd();$('#e').classList.remove('show');ed=null}};
const closeEd=acts.closeed;
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){AC();acts[a.dataset.a]?.(a.dataset,a,e)}});
$('#cf').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!curCh)return;await put('blobs','cph:'+curCh,f);delete urls['cph:'+curCh];S.chars.find(c=>c.id==curCh).photo=1;save();render()});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.i;
 if(f){if(f=='q'){Q=t.value;refreshGrid();return}if(f=='master'){S.master=+t.value;if(master)master.gain.value=S.master;save();return}
  const s=snd(t.dataset.id);if(!s)return;s[f]=t.type=='checkbox'?t.checked:(f=='size'||f=='vol')?+t.value:t.value;save();refreshGrid();return}
 const k=t.dataset.e;if(k&&ed){const v=t.type=='checkbox'?(t.checked?1:0):+t.value;if(k=='st')ed.st=Math.max(0,Math.min(v,ed.en-.05));else if(k=='en')ed.en=Math.min(ed.buf.duration,Math.max(v,ed.st+.05));else ed.fx[k]=v;const o=$('#o_'+k);if(o)o.textContent=v;sel()}});
document.addEventListener('change',e=>{if(e.target.dataset.e&&ed)hp()});
/* drag & drop tasti */
document.addEventListener('dragstart',e=>{const t=e.target.closest?.('.tile');if(t){dragId=t.dataset.sid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','x')}});
document.addEventListener('dragover',e=>{if(dragId&&e.target.closest('.tile,.tab'))e.preventDefault()});
document.addEventListener('drop',e=>{if(!dragId)return;const s=snd(dragId),t=e.target.closest('.tile'),b=e.target.closest('.tab');
 if(t&&t.dataset.sid!=dragId){const o=snd(t.dataset.sid);S.sounds=S.sounds.filter(x=>x!=s);S.sounds.splice(S.sounds.indexOf(o),0,s);s.cat=o.cat}else if(b){s.cat=b.dataset.id}else{dragId=null;return}
 dragId=null;save();render()});
/* ---------- Editor ---------- */
const FX=[['vol','Volume',0,3,.05],['fi','Fade in (s)',0,5,.1],['fo','Fade out (s)',0,5,.1],['speed','Velocità (cambia anche il tono)',.5,2,.05],['pitch','Pitch (semitoni)',-12,12,1]];
function openEd(sid){ed={sid,buf:null,st:0,en:0,fx:{vol:1,fi:0,fo:0,speed:1,pitch:0,rev:0,norm:0,echo:0},h:[],hi:-1,pps:50,pos:0,src:null,loop:false};
 $('#e').innerHTML=`<div class="box"><h3>Editor audio — ${esc(snd(sid).name)}</h3><label>Carica audio (MP3, WAV, M4A, AAC, OGG, FLAC) o video (MP4, MOV, WEBM): l'audio viene estratto in automatico</label><input type="file" id="fi" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.mp4,.mov,.webm"><button id="resume" data-a="resume" hidden style="margin-top:8px">↺ Riprendi l'ultimo file caricato</button>
 <div id="stw" hidden><p id="stt"></p><progress id="stp" max="100"></progress></div>
 <div id="body" hidden><div id="wv"><div id="in"><canvas id="cv"></canvas><div id="sel"></div><div class="h" id="hs" data-h="s"></div><div class="h" id="he" data-h="e"></div><div id="ph"></div></div></div>
 <div class="row" style="margin-top:0"><button class="bp" data-a="po">▶/⏸ Originale</button><button data-a="ps">⏹</button><button class="bp" data-a="psel">▶ PLAY SELEZIONE</button><button data-a="lp">🔁 Loop</button><button data-a="zo">－</button><button data-a="zi">＋ Zoom</button><button data-a="undo">↶</button><button data-a="redo">↷</button></div>
 <div class="g2"><div><label>Inizio (s)</label><input type="number" step=".01" min="0" data-e="st" id="i_st"></div><div><label>Fine (s)</label><input type="number" step=".01" min="0" data-e="en" id="i_en"></div></div><p>Selezione: <b id="sd"></b></p>
 <details><summary style="cursor:pointer">🎛 Effetti audio (opzionali)</summary><div class="fx">${FX.map(f=>`<div><label>${f[1]}: <b id="o_${f[0]}">${f[0]=='vol'||f[0]=='speed'?1:0}</b></label><input type="range" min="${f[2]}" max="${f[3]}" step="${f[4]}" value="${f[0]=='vol'||f[0]=='speed'?1:0}" data-e="${f[0]}"></div>`).join('')}
 <div><label><input type="checkbox" data-e="rev"> Al contrario</label><label><input type="checkbox" data-e="norm"> Normalizza</label><label><input type="checkbox" data-e="echo"> Eco</label></div></div></details></div>
 <div class="row"><button class="bp" data-a="sv" id="svb" disabled>💾 SALVA AUDIO</button><button data-a="closeed">Chiudi</button></div></div>`;
 $('#e').classList.add('show');$('#fi').addEventListener('change',e=>e.target.files[0]&&loadFile(e.target.files[0]));get('blobs','draft:'+sid).then(b=>{if(b&&ed)$('#resume').hidden=false}).catch(()=>{})}
function setSt(t,p){const w=$('#stw');if(!w)return;w.hidden=p===-1;$('#stt').textContent=t;const pr=$('#stp');if(p==null)pr.removeAttribute('value');else if(p>=0)pr.value=p}
async function loadFile(f){stopEd();setSt('Lettura file…',0);
 try{const ab=await new Promise((res,rej)=>{const r=new FileReader();r.onprogress=e=>e.lengthComputable&&setSt('Lettura file…',e.loaded/e.total*100);r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('lettura fallita'));r.readAsArrayBuffer(f)});
 setSt('Estrazione e decodifica audio… (può richiedere qualche secondo)',null);await new Promise(r=>setTimeout(r,40));ed.buf=await AC().decodeAudioData(ab)}
 catch(err){setSt('',-1);return toast('Impossibile leggere il file: formato non supportato da questo browser o file senza audio. Prova MP3/WAV oppure un video MP4/WEBM. Se è molto grande, usa un file più corto.')}
 if(f instanceof File)put('blobs','draft:'+ed.sid,f).catch(()=>{});setSt('',-1);$('#body').hidden=false;$('#svb').disabled=false;
 ed.st=0;ed.en=ed.buf.duration;ed.pos=0;ed.pps=Math.max(5,Math.min(($('#wv').clientWidth-4)/ed.buf.duration,30000/ed.buf.duration));draw();sel();ed.h=[];ed.hi=-1;hp()}
function draw(){const b=ed.buf,w=Math.ceil(b.duration*ed.pps),cv=$('#cv');cv.width=w;cv.height=160;cv.style.width=w+'px';$('#in').style.width=w+'px';const x=cv.getContext('2d'),d=b.getChannelData(0),step=Math.max(1,Math.floor(d.length/w));
 x.fillStyle='#8b5cf6';for(let i=0;i<w;i++){let mn=1,mx=-1;const k=Math.max(1,step>>5);for(let j=0;j<step;j+=k){const v=d[i*step+j]||0;if(v<mn)mn=v;if(v>mx)mx=v}x.fillRect(i,90+mn*60,1,Math.max(1,(mx-mn)*60))}
 const tk=[.1,.25,.5,1,2,5,10,30,60,120].find(t=>t*ed.pps>=60)||120;x.fillStyle='#8b8ba0';x.font='11px sans-serif';for(let t=0;t<b.duration;t+=tk){x.fillRect(t*ed.pps,0,1,8);x.fillText(Math.floor(t/60)+':'+(t%60).toFixed(tk<1?1:0).padStart(tk<1?4:2,'0'),t*ed.pps+3,18)}sel()}
function sel(){if(!ed?.buf)return;const p=ed.pps;$('#hs').style.left=ed.st*p+'px';$('#he').style.left=ed.en*p+'px';const s=$('#sel');s.style.left=ed.st*p+'px';s.style.width=(ed.en-ed.st)*p+'px';
 ['st','en'].forEach(k=>{const i=$('#i_'+k);if(i&&document.activeElement!==i)i.value=ed[k].toFixed(2)});$('#sd').textContent=(ed.en-ed.st).toFixed(2)+' s'}
function zoom(f){if(!ed.buf)return;ed.pps=Math.max(5,Math.min(ed.pps*f,30000/ed.buf.duration));draw()}
const ph=()=>{const p=$('#ph');if(p)p.style.left=(ed.src&&ed.orig?(ctx.currentTime-ed.t0):ed.pos)*ed.pps+'px'};
function stopEd(){if(!ed)return;cancelAnimationFrame(ed.raf);if(ed.src){ed.src.onended=null;try{ed.src.stop()}catch{}ed.src=null}}
function startEd(buf,off,loop,orig){stopEd();const c=AC(),s=c.createBufferSource();s.buffer=buf;s.loop=loop;s.connect(master);ed.t0=c.currentTime-off;ed.orig=orig;s.start(0,off);ed.src=s;
 s.onended=()=>{if(ed.src===s){ed.src=null;ed.pos=0;ph()}};const tick=()=>{if(ed.src===s){if(orig)ph();ed.raf=requestAnimationFrame(tick)}};tick()}
async function prev(loop){if(!ed.buf)return toast('Carica prima un file audio o video');stopEd();setSt('Elaborazione anteprima…',null);
 try{const b=await renderFx(ed.buf,ed.st,ed.en,ed.fx);setSt('',-1);startEd(b,0,loop,false)}catch(e){setSt('',-1);toast('Errore anteprima: '+e.message)}}
const snap=()=>JSON.stringify({st:ed.st,en:ed.en,fx:ed.fx});
function hp(){const s=snap();if(ed.h[ed.hi]===s)return;ed.h=ed.h.slice(0,ed.hi+1);ed.h.push(s);ed.hi=ed.h.length-1}
function applyH(){const o=JSON.parse(ed.h[ed.hi]);ed.st=o.st;ed.en=o.en;ed.fx=o.fx;document.querySelectorAll('[data-e]').forEach(i=>{const k=i.dataset.e;if(k in ed.fx){if(i.type=='checkbox')i.checked=!!ed.fx[k];else i.value=ed.fx[k];const out=$('#o_'+k);if(out)out.textContent=ed.fx[k]}});sel()}
document.addEventListener('pointerdown',e=>{const h=e.target.closest?.('.h');if(h&&ed?.buf){ed.drag=h.dataset.h;e.preventDefault()}});
document.addEventListener('pointermove',e=>{if(!ed?.drag)return;const r=$('#in').getBoundingClientRect(),t=Math.max(0,Math.min(ed.buf.duration,(e.clientX-r.left)/ed.pps));if(ed.drag=='s')ed.st=Math.min(t,ed.en-.05);else ed.en=Math.max(t,ed.st+.05);sel()});
document.addEventListener('pointerup',()=>{if(ed?.drag){ed.drag=null;hp()}});
/* ---------- Avvio ---------- */
(async()=>{try{const st=await get('kv','state');if(st)Object.assign(S,st);navigator.storage?.persist?.()}catch(e){toast('Archiviazione locale non disponibile: i dati non verranno salvati')}cat=S.cats[0].id;render()})();
</script></body></html>
